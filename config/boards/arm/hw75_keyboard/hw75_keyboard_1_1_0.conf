# Enable Zephyr USB device + HID class driver DBG logs so the
# "Device data not found for interface %u" / "Return Report Descriptor"
# messages surface. Combined with the LOG_INF in lamparray_hid_init
# these reveal whether the LampArray's bInterfaceNumber matches the
# host's GET_DESCRIPTOR HID_REPORT request and whether
# usb_get_dev_data_by_iface() finds a matching entry in usb_hid_devlist.
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
CONFIG_USB_HID_LOG_LEVEL_DBG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=4096

# ZMK USB logging exposes a CDC ACM interface that the Zephyr LOG backend
# writes to. The keyboard shows up as an extra COM port on Windows;
# open it with PuTTY/Tera Term at 115200 baud. TEMPORARY — strip after
# debugging the bInterfaceNumber issue.
CONFIG_ZMK_USB_LOGGING=y
