# Enable Zephyr USB device + HID class driver DBG logs so the
# "Device data not found for interface %u" / "Return Report Descriptor"
# messages surface. The LOG_INF in lamparray_hid_init is also useful
# for anyone running a debugger or a UART console on usart2. Note that
# without an actual log backend (RTT, UART, USB CDC) the strings are
# dead code at runtime — the user can read the source for the
# bInterfaceNumber assertion.
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
CONFIG_USB_HID_LOG_LEVEL_DBG=y
